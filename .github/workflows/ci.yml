name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: upstream/ matches upstream.lock.json (no hand edits)
        run: npm run sync:check
      - run: npm run lint
      - name: contract + unit tests
        run: npm test
      - run: npm run build
